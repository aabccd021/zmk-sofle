# Dongle connects to 2 peripheral halves (left + right)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Fetch battery levels from peripherals for display
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Enable OLED display
CONFIG_ZMK_DISPLAY=y
