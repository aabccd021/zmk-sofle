# Enable OLED display support (default: n)
CONFIG_ZMK_DISPLAY=y

# Enable mouse/trackball/pointing device support (default: n)
CONFIG_ZMK_POINTING=y

# Enable real-time keymap editing via web interface at https://zmk.studio (default: n)
CONFIG_ZMK_STUDIO=y

# Use future-default connection settings for better BLE stability (default: n)
# This also disables 2M PHY which can cause issues with some hosts
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Increase Bluetooth transmit power to +8 dBm (default: 0 dBm)
# Improves connection range and stability at cost of battery life
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Disable peripheral latency - respond to every connection event (default: 30)
# Lower latency = faster response but higher battery usage
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# Increase keyboard HID report queue size (default: 20)
# Larger queue prevents dropped keys during rapid typing
CONFIG_ZMK_BLE_KEYBOARD_REPORT_QUEUE_SIZE=36

# Increase split keyboard position event queue (default: 5)
# Larger queue handles fast key events from peripheral half
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=10

# Key press debounce time in milliseconds (default: 5ms)
# Higher value reduces key chatter but adds slight input delay
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=10

# Key release debounce time in milliseconds (default: 5ms)
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10
