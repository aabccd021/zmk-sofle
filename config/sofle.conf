# Enable OLED display support (default: n)
CONFIG_ZMK_DISPLAY=y

# Enable mouse/trackball/pointing device support (default: n)
CONFIG_ZMK_POINTING=y

# Enable real-time keymap editing via web interface at https://zmk.studio (default: n)
CONFIG_ZMK_STUDIO=y

# Use future-default connection settings for better BLE stability (default: n)
# This also disables 2M PHY which can cause issues with some hosts
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Use future-default security settings, allows re-pairing from same host (default: n)
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y
