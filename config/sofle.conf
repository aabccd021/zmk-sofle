# Disable 2M PHY for better BLE stability (will be default in future ZMK)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Increase Bluetooth transmit power to +8 dBm (default: 0 dBm)
# Improves connection range and stability between dongle and halves
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable mouse/pointing device emulation
CONFIG_ZMK_POINTING=y
