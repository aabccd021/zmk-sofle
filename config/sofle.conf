# Enable OLED display support (default: n)
CONFIG_ZMK_DISPLAY=y

# Enable mouse/trackball/pointing device support (default: n)
CONFIG_ZMK_POINTING=y

# Enable real-time keymap editing via web interface at https://zmk.studio (default: n)
CONFIG_ZMK_STUDIO=y

# Fetch battery level from peripheral half of split keyboard (default: n)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Report both halves' battery levels to host OS (default: n)
# Requires BATTERY_LEVEL_FETCHING to be enabled
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Use future-default connection settings for better BLE stability (default: n)
# This also disables 2M PHY which can cause issues with some hosts
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Use future-default security settings, allows re-pairing from same host (default: n)
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y

# Explicitly disable 2M PHY for compatibility (default: y, but n when EXPERIMENTAL_CONN is enabled)
CONFIG_BT_CTLR_PHY_2M=n

# Increase Bluetooth transmit power to +8 dBm for better range (default: hardware-dependent)
# Trade-off: uses more battery
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Disable peripheral latency - respond to every connection event (default: 30)
# Lower = faster response, higher battery usage
# Value of 0 means no skipped connection events
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# Increase keyboard HID report queue size (default: 20)
# Larger queue prevents dropped keys during rapid typing
CONFIG_ZMK_BLE_KEYBOARD_REPORT_QUEUE_SIZE=36

# Increase split keyboard position event queue (default: 5)
# Larger queue handles fast key events from peripheral half
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=10

# Increase key scan event queue size (default: 4)
# Larger queue buffers more simultaneous key events
CONFIG_ZMK_KSCAN_EVENT_QUEUE_SIZE=12

# Key press debounce time in milliseconds (default: 5ms via devicetree)
# Higher value reduces key chatter but adds slight input delay
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=10

# Key release debounce time in milliseconds (default: 5ms via devicetree)
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10
