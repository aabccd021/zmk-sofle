# ZMK build matrix for Sofle keyboard with dongle setup
# - Dongle: central device, connects via USB to PC
# - Left/Right: peripherals, connect via BLE to dongle
---
include:
  - board: nice_nano_v2
    shield: sofle_dongle dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO_LOCKING=n
  - board: nice_nano_v2
    shield: sofle_left
  - board: nice_nano_v2
    shield: sofle_right
  - board: nice_nano_v2
    shield: settings_reset
